<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>deals · sndbx.ing</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --raised: #1d2129;
    --text: #e8e9ec; --muted: #9aa1ac; --dim: #6b727d;
    --accent: #7cc4ff; --border: #262b35;
    --good: #6ee7a8; --warn: #f5c451; --bad: #ef7b7b;
    --t1: #d9a441; --t2: #7cc4ff; --t3: #8f96a3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45; padding: 32px 20px 80px;
  }
  main { max-width: 860px; margin: 0 auto; }

  a { color: inherit; text-decoration: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  header { margin-bottom: 24px; display: flex; flex-direction: column; gap: 6px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .sub b { color: var(--text); font-weight: 600; }

  /* ---- stat strip ---- */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px; background: var(--border); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 26px;
  }
  .stat { background: var(--card); padding: 14px 16px; }
  .stat-k {
    font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 4px;
  }
  .stat-v { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
  .stat-v.accent { color: var(--accent); }
  .stat-v.good { color: var(--good); }

  /* ---- deal rows ---- */
  .section-label {
    font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 10px 2px;
  }
  .deals { display: flex; flex-direction: column; gap: 8px; }

  .deal {
    display: grid;
    grid-template-columns: 58px 1fr auto;
    gap: 14px; align-items: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    transition: border-color .15s ease, background .15s ease;
  }
  .deal:hover { border-color: var(--accent); background: var(--raised); }
  .deal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .thumb {
    width: 58px; height: 58px; border-radius: 7px; object-fit: cover;
    background: var(--raised); border: 1px solid var(--border); display: block;
  }
  .thumb.ph { display: grid; place-items: center; color: var(--dim); font-size: 1.1rem; }

  .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .line1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .model { color: var(--muted); }
  .model.unknown { color: var(--dim); font-style: italic; }
  .line2 { font-size: 0.8rem; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; }

  .tier {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor;
    text-transform: uppercase; flex: none;
  }
  .tier.t1 { color: var(--t1); }
  .tier.t2 { color: var(--t2); }
  .tier.t3 { color: var(--t3); }

  .money { text-align: right; display: flex; flex-direction: column; gap: 2px; flex: none; }
  .buy { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.02em; }
  .net { font-size: 0.78rem; color: var(--good); font-weight: 600; }
  .net.none { color: var(--dim); font-weight: 400; }

  .empty {
    background: var(--card); border: 1px dashed var(--border); border-radius: 10px;
    padding: 34px 20px; text-align: center; color: var(--muted); font-size: 0.92rem;
  }
  .empty b { display: block; color: var(--text); margin-bottom: 5px; font-size: 1rem; }

  footer {
    margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--border);
    color: var(--dim); font-size: 0.78rem; display: flex;
    justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }

  @media (max-width: 560px) {
    .deal { grid-template-columns: 44px 1fr; }
    .thumb { width: 44px; height: 44px; }
    .money { grid-column: 2; flex-direction: row; align-items: baseline; gap: 10px; text-align: left; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>deals <span>· sndbx.ing</span></h1>
    <p class="sub" id="sub">Loading…</p>
  </header>

  <div class="stats" id="stats"></div>

  <p class="section-label" id="listlabel">Open deals</p>
  <div class="deals" id="deals"></div>

  <footer>
    <span>momox fashion · polled every 15 min from a Mac in Germany</span>
    <a href="https://sndbx.ing">← sndbx.ing</a>
  </footer>
</main>

<script>
const eur = n => "€" + Number(n).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});

function ago(iso) {
  if (!iso) return "never";
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const h = Math.round(mins / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}

function statCell(k, v, cls) {
  return `<div class="stat"><div class="stat-k">${k}</div>
          <div class="stat-v num ${cls || ""}">${v}</div></div>`;
}

function dealRow(d) {
  const tier = d.tier ? `<span class="tier t${d.tier}">T${d.tier}</span>` : "";
  const model = d.model_name && d.model_name !== "unknown"
    ? `<span class="model">${d.model_name}</span>`
    : `<span class="model unknown">not yet identified</span>`;

  const bits = [];
  if (d.size_eu) bits.push("EU " + d.size_eu);
  if (d.condition_grade) bits.push("cond " + d.condition_grade + "/10");
  if (d.subcat) bits.push(d.subcat.replace(/_/g, " "));
  if (d.comp_eur) bits.push("comp " + eur(d.comp_eur));

  const net = d.net_eur != null
    ? `<span class="net">+${eur(d.net_eur)} net</span>`
    : `<span class="net none">not yet valued</span>`;

  const thumb = d.image
    ? `<img class="thumb" src="${d.image}" alt="" loading="lazy">`
    : `<div class="thumb ph">👟</div>`;

  return `<a class="deal" href="${d.url}" target="_blank" rel="noopener">
    ${thumb}
    <div class="body">
      <div class="line1">${tier}<span class="brand">${d.vendor}</span>${model}</div>
      <div class="line2">${bits.map(b => `<span>${b}</span>`).join("")}</div>
    </div>
    <div class="money"><span class="buy num">${eur(d.price_eur)}</span>${net}</div>
  </a>`;
}

fetch("deals.json?" + Date.now())
  .then(r => r.json())
  .then(data => {
    const c = data.counts || {};
    const deals = data.deals || [];
    const valued = deals.filter(d => d.net_eur != null);
    const totalNet = valued.reduce((s, d) => s + d.net_eur, 0);

    document.getElementById("sub").innerHTML =
      `<b>${deals.length}</b> profitable · ${data.unprofitable || 0} rejected · `
      + `last poll ${ago(data.last_poll)}`;

    document.getElementById("stats").innerHTML =
      statCell("Profitable", deals.length, "accent") +
      statCell("Total net", valued.length ? eur(totalNet) : "—", valued.length ? "good" : "") +
      statCell("Rejected", data.unprofitable || 0) +
      statCell("Awaiting price", c.pending || 0) +
      statCell("Tracked", data.tracked || 0);

    document.getElementById("deals").innerHTML = deals.length
      ? deals.map(dealRow).join("")
      : `<div class="empty"><b>No profitable deals right now</b>
         Working as intended: ${data.unprofitable || 0} listings were valued and
         came out below €${(data.min_net_eur || 0).toFixed(0)} net, so they are
         hidden. ${c.pending || 0} more are waiting on momox to price them.</div>`;

    document.getElementById("listlabel").textContent =
      `Profitable deals · at least €${(data.min_net_eur || 0).toFixed(0)} net`;
  })
  .catch(() => {
    document.getElementById("sub").textContent = "Could not load deals.json";
    document.getElementById("deals").innerHTML =
      `<div class="empty"><b>No data yet</b>Run the collector, then publish.py.</div>`;
  });

setTimeout(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
