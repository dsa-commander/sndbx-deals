<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>deals · sndbx.ing</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --raised: #1d2129;
    --text: #e8e9ec; --muted: #9aa1ac; --dim: #6b727d;
    --accent: #7cc4ff; --border: #262b35;
    --good: #6ee7a8; --warn: #f5c451; --bad: #ef7b7b;
    --t1: #d9a441; --t2: #7cc4ff; --t3: #8f96a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45; padding: 32px 20px 80px;
  }
  main { max-width: 980px; margin: 0 auto; }
  a { color: inherit; text-decoration: none; }
  .num { font-variant-numeric: tabular-nums; }

  header { margin-bottom: 24px; display: flex; flex-direction: column; gap: 6px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .sub b { color: var(--text); font-weight: 600; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
    gap: 1px; background: var(--border); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 26px;
  }
  .stat { background: var(--card); padding: 14px 16px; }
  .stat-k {
    font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 4px;
  }
  .stat-v { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
  .stat-v.accent { color: var(--accent); }
  .stat-v.good { color: var(--good); }

  /* Filter chips. Toggling is instant because deals.json carries everything
     and the filtering happens here, not in a re-run. */
  .filters {
    display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
    margin-bottom: 16px;
  }
  .chip {
    font-size: 0.76rem; color: var(--muted); cursor: pointer;
    border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 11px; background: var(--card); user-select: none;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .chip:hover { border-color: var(--dim); color: var(--text); }
  .chip.on {
    color: var(--bg); background: var(--accent); border-color: var(--accent);
    font-weight: 600;
  }
  .chip.sep { border: none; background: none; cursor: default; color: var(--dim);
              padding-left: 4px; padding-right: 2px; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* momox's condition grade, called out because it is their judgement of a
     shoe they physically handled rather than anything inferred here. */
  .grade { color: var(--text); }
  .grade.best { color: var(--good); font-weight: 600; }
  /* A collaboration: momox priced it as the base brand, so this is the fact
     most likely to mean margin. */
  .collab { color: var(--accent); font-weight: 600; }

  .addbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .addbar input {
    flex: 1 1 320px; min-width: 0;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font: inherit; font-size: 0.85rem;
  }
  .addbar input:focus { outline: none; border-color: var(--accent); }
  .addbar button { border: none; cursor: pointer; font: inherit; }
  .addnote { font-size: 0.74rem; color: var(--dim); flex-basis: 100%; }

  .section-label {
    font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 10px 2px;
  }
  .deals { display: flex; flex-direction: column; gap: 8px; }

  /* Three columns: images | everything textual | price.
     Every text node lives inside .body — nothing else may become a grid
     child, or it lands in the wrong column and overlaps the thumbnails. */
  .deal {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 14px; align-items: start;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 15px;
    transition: border-color .15s ease, background .15s ease;
  }
  .deal:hover { border-color: var(--accent); background: var(--raised); }

  .pair { display: flex; gap: 5px; align-items: center; flex: none; }
  .pair .vs {
    color: var(--dim); font-size: 0.58rem; letter-spacing: .04em;
    text-transform: uppercase;
  }
  .thumb {
    width: 56px; height: 56px; border-radius: 7px; object-fit: cover;
    background: var(--raised); border: 1px solid var(--border); display: block;
  }
  .thumb.ref { border-style: dashed; }
  .pair a:hover .thumb.ref { border-color: var(--accent); border-style: solid; }
  .thumb.ph { display: grid; place-items: center; color: var(--dim); font-size: 1.1rem; }

  .body { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .title-link { display: block; min-width: 0; }
  .title-link:hover .brand { color: var(--accent); }

  .line1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .model { color: var(--muted); }
  .model.unknown { color: var(--dim); font-style: italic; }

  .line2 {
    font-size: 0.78rem; color: var(--dim);
    display: flex; gap: 10px; flex-wrap: wrap; overflow-wrap: anywhere;
  }
  .build {
    font-size: 0.78rem; line-height: 1.35; color: var(--warn);
    opacity: .85; overflow-wrap: anywhere;
  }
  /* Emblems and numerals read off the shoe — often the model number itself. */
  .marks {
    font-size: 0.76rem; line-height: 1.35; color: var(--good);
    opacity: .8; overflow-wrap: anywhere;
  }

  .tier {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor;
    text-transform: uppercase; flex: none;
  }
  .tier.t1 { color: var(--t1); }
  .tier.t2 { color: var(--t2); }
  .tier.t3 { color: var(--t3); }

  /* Which shelf it is on. Two sources now buy differently: momox is a flat
     price band, sellpy prices per item, so knowing the source changes how you
     read the number next to it. */
  .src {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase; flex: none;
    background: var(--border); color: var(--dim);
  }
  .src.sellpy { background: #2f6b4f; color: #fff; }

  /* An identification nothing corroborates. Asked five times about one pair of
     photos the model returned three unrelated model families, most of them
     marked "high" confidence — so a net figure built on an uncorroborated name
     must not read as fact. */
  .unconf {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase; flex: none;
    background: #6b2f2f; color: #ffd9d4;
  }
  .net.soft { opacity: 0.6; }

  .refs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 1px; }
  .refs a, .refs span {
    font-size: 0.72rem; color: var(--accent); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 7px; background: var(--bg);
  }
  .refs a:hover { border-color: var(--accent); }
  .refs .retail { color: var(--warn); border-color: transparent; }
  .refs a[href*="google.com/search"] { color: var(--good); }
  .refs a.lens {
    color: var(--bg); background: var(--good); border-color: var(--good);
    font-weight: 600;
  }
  .refs a.lens:hover { filter: brightness(1.12); }

  .money {
    text-align: right; display: flex; flex-direction: column; gap: 2px;
    flex: none; padding-top: 2px;
  }
  .buy { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.02em; }
  .net { font-size: 0.78rem; color: var(--good); font-weight: 600; }
  .net.none { color: var(--dim); font-weight: 400; }

  .empty {
    background: var(--card); border: 1px dashed var(--border); border-radius: 10px;
    padding: 34px 20px; text-align: center; color: var(--muted); font-size: 0.92rem;
  }
  .empty b { display: block; color: var(--text); margin-bottom: 5px; font-size: 1rem; }

  footer {
    margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--border);
    color: var(--dim); font-size: 0.78rem; display: flex;
    justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }

  @media (max-width: 620px) {
    .deal { grid-template-columns: auto minmax(0, 1fr); }
    .money { grid-column: 2; flex-direction: row; align-items: baseline; gap: 10px; text-align: left; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>deals <span>· sndbx.ing</span></h1>
    <p class="sub" id="sub">Loading…</p>
  </header>

  <div class="stats" id="stats"></div>

  <!-- Add-by-URL with no backend.
       A static page cannot receive a POST, but it can OPEN a pre-filled GitHub
       issue, and the Mac polls those. GitHub is the inbox: free, already part
       of this setup, and reachable from a phone. -->
  <form class="addbar" id="addbar">
    <input id="addurl" type="url" inputmode="url" autocomplete="off"
           placeholder="paste a momox product URL to add it…">
    <button class="chip on" type="submit">add</button>
    <span class="addnote" id="addnote"></span>
  </form>

  <div class="filters" id="filters">
    <span class="chip sep">show</span>
    <button class="chip on" data-f="sneakers">sneakers only</button>
    <button class="chip" data-f="all">everything</button>
    <span class="chip sep">require</span>
    <button class="chip" data-f="confirmed">confirmed match</button>
    <button class="chip" data-f="code">model number</button>
    <button class="chip" data-f="margin">≥25% margin</button>
    <button class="chip" data-f="likenew">like new</button>
    <button class="chip" data-f="collab">collabs</button>
    <span class="chip sep">source</span>
    <button class="chip" data-f="momox">momox</button>
    <button class="chip" data-f="sellpy">sellpy</button>
  </div>

  <p class="section-label" id="listlabel">Deals</p>
  <div class="deals" id="deals"></div>

  <footer>
    <span>momox fashion · polled every 15 min from a Mac in Germany</span>
    <a href="https://sndbx.ing">← sndbx.ing</a>
  </footer>
</main>

<script>
const eur = n => "€" + Number(n).toLocaleString("de-DE",
  {minimumFractionDigits: 2, maximumFractionDigits: 2});

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

function ago(iso) {
  if (!iso) return "never";
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const h = Math.round(mins / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}

function statCell(k, v, cls) {
  return '<div class="stat"><div class="stat-k">' + esc(k) + '</div>'
       + '<div class="stat-v num ' + (cls || "") + '">' + v + "</div></div>";
}

function dealRow(d) {
  const tier = d.tier ? '<span class="tier t' + d.tier + '">T' + d.tier + "</span>" : "";
  const rare = d.limited_edition ? '<span class="tier t1">RARE?</span>' : "";
  const src_ = d.source && d.source !== "momox"
    ? '<span class="src ' + esc(d.source) + '">' + esc(d.source) + "</span>" : "";
  // Only flag it where it changes a decision: a listing carrying a money figure
  // that nothing corroborates.
  const unconfirmed = d.net_eur != null && !d.confirmed && !d.has_code;
  const unconf = unconfirmed ? '<span class="unconf">unconfirmed id</span>' : "";

  // Without a price the model name is a best guess, so label it as one.
  const guess = d.net_eur == null;
  const model = (d.model_name && d.model_name !== "unknown")
    ? '<span class="model">' + (guess ? "closest: " : "") + esc(d.model_name) + "</span>"
    : '<span class="model unknown">unidentified</span>';

  const bits = [];
  // The collaboration is the single most valuable fact on the card: momox
  // priced this as the base brand.
  if (d.collab_label) bits.push('<span class="collab">' + esc(d.collab_label) + "</span>");
  if (d.size_eu) bits.push("EU " + esc(d.size_eu));
  // momox's own grade first — they held the shoe, vision only saw photos.
  if (d.condition_momox) {
    bits.push('<span class="grade' + (d.is_like_new ? " best" : "") + '">'
              + esc(d.condition_momox) + "</span>");
  } else if (d.condition_grade) {
    bits.push("cond " + d.condition_grade + "/10");
  }
  if (d.subcat) bits.push(esc(String(d.subcat).replace(/_/g, " ")));
  if (d.colorway) bits.push(d.colorway);
  if (d.comp_eur) bits.push("comp " + eur(d.comp_eur));
  if (d.margin_pct != null) bits.push(Math.round(d.margin_pct * 100) + "% margin");
  if (d.style_code) bits.push(esc(d.style_code));
  if (d.logo_construction && d.logo_construction !== "not_visible"
      && d.logo_construction !== "stitched_overlay") {
    bits.push("logo: " + esc(d.logo_construction.replace(/_/g, "-")));
  }
  if (d.materials) bits.push(esc(d.materials.slice(0, 70)));

  const net = d.net_eur != null
    ? '<span class="net' + (unconfirmed ? " soft" : "") + '">+' + eur(d.net_eur) + " net</span>"
    : '<span class="net none">no price found</span>';

  const shot = d.image
    ? '<img class="thumb" src="' + esc(d.image) + '" alt="listing" loading="lazy">'
    : '<div class="thumb ph">👟</div>';
  // Listing photo beside the reference product: same shoe, or not?
  // The reference image links to the page it came from, so a wrong match can
  // be checked in one click.
  const refHref = d.ref_stockx_url || d.ref_afew_url;
  const refImg = '<img class="thumb ref" src="' + esc(d.ref_image) + '" alt="reference" '
    + 'loading="lazy" title="' + esc(d.ref_title || "reference product") + '">';
  const thumb = d.ref_image
    ? '<div class="pair">' + shot + '<span class="vs">vs</span>'
      + (refHref
          ? '<a href="' + esc(refHref) + '" target="_blank" rel="noopener" '
            + 'title="' + esc(d.ref_title || "") + '">' + refImg + "</a>"
          : refImg)
      + "</div>"
    : '<div class="pair">' + shot + "</div>";

  // Build the best Google query the agent can from what it actually knows.
  //
  // Even an "unidentified" listing usually carries enough: a style code alone
  // is decisive, and failing that the brand plus the emblems read off the shoe
  // plus a distinctive material beats anything typed from memory.
  const g = [];
  if (d.style_code) {
    // A style code identifies one release; extra words only add noise.
    g.push(d.vendor.split(" ")[0], d.style_code);
  } else {
    g.push(d.vendor);
    if (d.model_name && d.model_name !== "unknown") g.push(d.model_name);
    // Colourway is often the whole difference between two releases of one
    // model, and it is what a human would type. Brands name them, so the
    // words tend to appear verbatim in listings and articles.
    if (d.colorway) g.push(d.colorway);
    if (d.branding_marks) {
      // Quoted wordmarks off the shoe: "ultra boost", "Parley Ocean Plastic".
      const quoted = (d.branding_marks.match(/[A-Za-z0-9][\w'’\-]*(?: [\w'’\-]+){0,2}/g) || [])
        .filter(w => w.length > 3 && !/^(on|the|and|logo|panel|insole|heel|tongue|midsole|lateral)$/i.test(w))
        .slice(0, 3);
      g.push(...quoted);
    }
    if (!d.model_name || d.model_name === "unknown") {
      // No name: lead with the colours, they are the most searchable thing
      // a person can see in the photo.
      if (!d.colorway && d.materials) g.push(d.materials.split(/[,;]/)[0]);
      if (d.subcat) g.push(String(d.subcat).replace(/_/g, " "));
    }
  }
  if (d.size_eu) g.push("EU " + d.size_eu);
  const gq = encodeURIComponent(g.filter(Boolean).join(" ").slice(0, 220));

  const refs = [];

  // Google Lens, on the listing photo itself.
  //
  // Lens searches billions of web images; this index holds a few thousand
  // products. For an ambiguous shoe Lens will simply beat anything running
  // locally, so the useful move is to hand the photo straight to it rather
  // than pretend to compete. The image is already public on momox's CDN.
  if (d.image) {
    refs.push('<a class="lens" href="https://lens.google.com/uploadbyurl?url='
      + encodeURIComponent(d.image)
      + '" target="_blank" rel="noopener" '
      + 'title="reverse image search this exact photo">Lens ↗</a>');
  }
  refs.push('<a href="https://www.google.com/search?q=' + gq
    + '" target="_blank" rel="noopener" title="search Google with everything known about this shoe">Google ↗</a>');
  if (d.retail_eur) refs.push('<span class="retail">retail €' + Number(d.retail_eur).toFixed(0) + "</span>");
  // Without a compared photo these are places to look, not confirmations.
  const confirmed = Boolean(d.ref_image);
  const verb = confirmed ? "" : "search ";
  if (d.ref_afew_url) refs.push('<a href="' + esc(d.ref_afew_url) + '" target="_blank" rel="noopener">' + verb + "afew ↗</a>");
  if (d.ref_stockx_url) refs.push('<a href="' + esc(d.ref_stockx_url) + '" target="_blank" rel="noopener">' + verb + "StockX ↗</a>");
  const refbar = refs.length ? '<div class="refs">' + refs.join("") + "</div>" : "";

  return '<div class="deal">'
    + thumb
    + '<div class="body">'
      + '<a class="title-link" href="' + esc(d.url) + '" target="_blank" rel="noopener">'
        + '<div class="line1">' + tier + rare + src_ + unconf
        + '<span class="brand">' + esc(d.vendor) + "</span>" + model + "</div>"
      + "</a>"
      + '<div class="line2">' + bits.map(b => "<span>" + b + "</span>").join("") + "</div>"
      + (d.branding_marks ? '<div class="marks">marks: ' + esc(d.branding_marks) + "</div>" : "")
      + (d.construction_notes ? '<div class="build">' + esc(d.construction_notes) + "</div>" : "")
      + refbar
    + "</div>"
    + '<div class="money"><span class="buy num">' + eur(d.price_eur) + "</span>" + net + "</div>"
    + "</div>";
}

let DATA = null;
// "sneakers" and "all" are one choice; the rest are independent requirements.
const FILTERS = {sneakers: true, all: false, confirmed: false, code: false,
                margin: false, likenew: false, collab: false,
                momox: false, sellpy: false};

function visible() {
  const floorPct = (DATA && DATA.min_margin_pct) || 0.25;
  return (DATA.deals || []).filter(d => {
    if (FILTERS.sneakers && !d.is_sneaker) return false;
    if (FILTERS.confirmed && !d.confirmed) return false;
    if (FILTERS.code && !d.has_code) return false;
    if (FILTERS.margin && !(d.margin_pct != null && d.margin_pct >= floorPct)) return false;
    // momox's own grade. A listing whose grade has not been read yet is NOT
    // "like new" — showing unchecked rows under this chip would assert a
    // condition nobody verified.
    if (FILTERS.likenew && !d.is_like_new) return false;
    if (FILTERS.collab && !d.is_collab) return false;
    // Source chips are a pair: neither on means both shown, rather than none.
    if (FILTERS.momox !== FILTERS.sellpy) {
      const s = d.source || "momox";
      if (FILTERS.momox && s !== "momox") return false;
      if (FILTERS.sellpy && s !== "sellpy") return false;
    }
    return true;
  });
}

function render() {
  const deals = visible();
  const valued = deals.filter(d => d.net_eur != null);
  const totalNet = valued.reduce((s, d) => s + d.net_eur, 0);
  const floor = Number(DATA.min_net_eur || 0).toFixed(0);
  const pct = Math.round((DATA.min_margin_pct || 0.25) * 100);

  document.getElementById("stats").innerHTML =
    statCell("Showing", deals.length, "accent")
    + statCell("Total net", valued.length ? eur(totalNet) : "—", valued.length ? "good" : "")
    + statCell("Confirmed", deals.filter(d => d.confirmed).length)
    + statCell("Rejected", DATA.unprofitable || 0)
    + statCell("Unvalued", DATA.unvalued || 0)
    + statCell("Tracked", DATA.tracked || 0);

  const active = Object.entries(FILTERS)
    .filter(([k, v]) => v && k !== "all" && k !== "sneakers")
    .map(([k]) => k === "code" ? "model number"
               : k === "margin" ? ("≥" + pct + "% margin")
               : k === "likenew" ? ("condition: " + ((DATA && DATA.like_new_grade) || "Wie neu"))
               : k === "collab" ? "collaboration"
               : k);
  document.getElementById("listlabel").textContent =
    (FILTERS.sneakers ? "Sneakers" : "All footwear")
    + (active.length ? " · requiring " + active.join(" + ") : "")
    + " · profit ≥ €" + floor;

  document.getElementById("deals").innerHTML = deals.length
    ? deals.map(dealRow).join("")
    : '<div class="empty"><b>Nothing matches these filters</b>'
      + "Loosen a requirement above. " + (DATA.unprofitable || 0)
      + " listings were valued below €" + floor + " net and are never shown; "
      + (DATA.unvalued || 0) + " could not be valued.</div>";
}

const REPO = "dsa-commander/sndbx-deals";

document.getElementById("addbar").addEventListener("submit", e => {
  e.preventDefault();
  const field = document.getElementById("addurl");
  const url = field.value.trim();
  const note = document.getElementById("addnote");
  if (!/^https?:\/\/\S+$/.test(url)) {
    note.textContent = "That does not look like a URL.";
    return;
  }
  // Open a pre-filled issue. The Mac polls open issues labelled "add", runs
  // add.py on the URL, comments the result and closes it.
  const issue = "https://github.com/" + REPO + "/issues/new"
    + "?labels=add"
    + "&title=" + encodeURIComponent("add: " + url.slice(0, 90))
    + "&body=" + encodeURIComponent(url);
  window.open(issue, "_blank", "noopener");
  note.textContent = "Opened a GitHub issue — submit it and the agent picks it "
    + "up within 15 minutes.";
  field.value = "";
});

document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button.chip");
  if (!b || !DATA) return;
  const f = b.dataset.f;
  if (f === "sneakers" || f === "all") {
    FILTERS.sneakers = (f === "sneakers");
    FILTERS.all = !FILTERS.sneakers;
  } else {
    FILTERS[f] = !FILTERS[f];
  }
  document.querySelectorAll("#filters button.chip").forEach(x =>
    x.classList.toggle("on", FILTERS[x.dataset.f]));
  render();
});

fetch("deals.json?" + Date.now())
  .then(r => r.json())
  .then(data => {
    DATA = data;
    document.getElementById("sub").innerHTML =
      "<b>" + (data.profitable || 0) + "</b> profitable · "
      + (data.unprofitable || 0) + " rejected · last poll " + ago(data.last_poll);
    render();
  })
  .catch(() => {
    document.getElementById("sub").textContent = "Could not load deals.json";
    document.getElementById("deals").innerHTML =
      '<div class="empty"><b>No data yet</b>Run the collector, then publish.py.</div>';
  });

setTimeout(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
